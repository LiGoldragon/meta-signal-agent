[package]
name         = "meta-signal-agent"
version      = "0.2.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-agent"
description  = "Meta policy Signal contract for the agent LLM-call component."
publish      = false
links        = "meta-signal-agent"
build        = "build.rs"

[lib]
name = "meta_signal_agent"
path = "src/lib.rs"

[features]
default = ["nota-text"]
nota-text = ["dep:nota", "signal-frame/nota-text"]

[[test]]
name = "round_trip"
path = "tests/round_trip.rs"
required-features = ["nota-text"]

[dependencies]
nota         = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main", optional = true }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "drop-next", default-features = false }
thiserror    = "2"

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", branch = "drop-next" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
